<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Tycoon - Админ-панель</title>
<style>
body{background:#0a0b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;margin:0}
h1{color:#f1c40f;font-size:20px;display:flex;align-items:center;gap:10px}
.player{background:#181b28;padding:12px 16px;margin-bottom:8px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border:1px solid rgba(255,255,255,0.05)}
.player-info{font-size:13px;line-height:1.5}
.player-info span{color:#8e94a8;font-size:11px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button{background:#f1c40f;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:11px;transition:0.2s}
button:hover{opacity:0.8}
.danger{background:#e74c3c;color:#fff}
.green{background:#2ecc71;color:#fff}
</style>
</head>
<body>
<h1>👑 Админ-панель PC Tycoon</h1>
<div style="color:#8e94a8;font-size:12px;margin-bottom:20px;">Синхронизация с игрой каждые 10 секунд</div>
<div id="players" style="margin-top:20px;">Загрузка игроков...</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyAv0ChOvxUSEWjCnWWUXBml01PyTsgfGjo",
    authDomain: "pc-tycoon-11216.firebaseapp.com",
    databaseURL: "https://pc-tycoon-11216-default-rtdb.firebaseio.com",
    projectId: "pc-tycoon-11216",
    storageBucket: "pc-tycoon-11216.firebasestorage.app",
    messagingSenderId: "587863804885",
    appId: "1:587863804885:web:ab92c591d56098cd4fcb5c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref('players').on('value', (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('players');
    if (!data) {
        container.innerHTML = '<div style="color:#8e94a8;">Пока нет игроков. Запустите игру и подождите 10 секунд.</div>';
        return;
    }
    let html = '';
    Object.keys(data).forEach(key => {
        const p = data[key];
        const date = new Date(p.lastUpdate || Date.now()).toLocaleTimeString();
        html += `<div class="player">
            <div class="player-info">
                <b>${p.name || 'Без имени'}</b> | 📍 ${p.city}<br>
                <span>💰 ${(p.balance||0).toLocaleString()} ₽ | ⭐ ${p.reputation||0}% | 📅 День ${p.day||1} | 🕒 ${date}</span>
            </div>
            <div class="actions">
                <button class="green" onclick="addMoney('${key}',10000)">+10 000 ₽</button>
                <button class="green" onclick="addMoney('${key}',100000)">+100 000 ₽</button>
                <button class="green" onclick="addRep('${key}')">+20 ⭐</button>
                <button class="danger" onclick="resetPlayer('${key}')">Сбросить</button>
            </div>
        </div>`;
    });
    container.innerHTML = html;
});

function addMoney(id, amount) {
    db.ref('players/' + id).once('value').then(snap => {
        const p = snap.val();
        if(p) db.ref('players/' + id).update({
            balance: (p.balance || 0) + amount,
            adminModified: Date.now()
        });
    });
}

function addRep(id) {
    db.ref('players/' + id).once('value').then(snap => {
        const p = snap.val();
        if(p) db.ref('players/' + id).update({
            reputation: Math.min(100, (p.reputation || 0) + 20),
            adminModified: Date.now()
        });
    });
}

function resetPlayer(id) {
    if(confirm('Вы уверены, что хотите сбросить этого игрока?')) {
        db.ref('players/' + id).update({
            balance: 30000, reputation: 50, day: 1,
            adminModified: Date.now()
        });
    }
}
</script>
</body>
</html>
